      description: Leader only. Returns the current invite token and join path. Set
        rotate=true to invalidate the previous link.
      parameters:
      - description: Trip UUID
        format: uuid
        in: path
        name: tripId
        required: true
        type: string
      - description: Mint a new token and drop the old one
        in: query
        name: rotate
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TripInviteLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create trip invite link
      tags:
      - trips
  /trips/{tripId}/leave:
    post:
      description: The caller leaves (status left). If the leader leaves, leadership
        transfers to the earliest-joined remaining member. The last remaining leader
        must delete the trip instead.
      parameters:
      - description: Trip UUID
        format: uuid
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Left the trip
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Leave trip
      tags:
      - trips
  /trips/join/{token}:
    post:
      description: Authenticated caller joins the trip identified by the invite token
        as a member. Reuses a left/rejected/kicked row. Already-active members get
        409.
      parameters:
      - description: Invite token (UUID)
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Road-To-Destination-BE_module_trip_model_response.TripResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Join trip via invite link
      tags:
      - trips
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
  PlaygroundKey:
    description: Shared secret from GOONG_PLAYGROUND_KEY. Scalar → Authorize.
    in: header
    name: X-Playground-Key
    type: apiKey
swagger: "2.0"
