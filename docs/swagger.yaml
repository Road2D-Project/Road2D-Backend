basePath: /v1
definitions:
  model.LatLng:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  model.LocationLeg:
    properties:
      computed_at:
        type: string
      destination:
        type: string
      distance_m:
        type: integer
      duration_s:
        type: integer
      origin:
        type: string
      polyline:
        type: string
      steps:
        items:
          $ref: '#/definitions/model.RouteStep'
        type: array
      vehicle:
        example: bike
        type: string
    type: object
  model.RouteStep:
    properties:
      distance_m:
        type: integer
      duration_s:
        type: integer
      end:
        $ref: '#/definitions/model.LatLng'
      instruction:
        type: string
      maneuver:
        type: string
      polyline:
        type: string
      start:
        $ref: '#/definitions/model.LatLng'
      travel_mode:
        type: string
    type: object
  model.Trip:
    properties:
      code:
        type: string
      computed_at:
        type: string
      destination:
        type: string
      origin:
        type: string
      roundtrip:
        type: boolean
      trips:
        items:
          $ref: '#/definitions/model.TripRoute'
        type: array
      vehicle:
        example: car
        type: string
      visit_order:
        items:
          $ref: '#/definitions/model.TripStop'
        type: array
      waypoints:
        items:
          $ref: '#/definitions/model.TripStop'
        type: array
    type: object
  model.TripLeg:
    properties:
      distance:
        type: number
      duration:
        type: number
      steps:
        items:
          $ref: '#/definitions/model.TripStep'
        type: array
      summary:
        type: string
      weight:
        type: number
    type: object
  model.TripRoute:
    properties:
      distance:
        type: number
      duration:
        type: number
      geometry:
        type: string
      legs:
        items:
          $ref: '#/definitions/model.TripLeg'
        type: array
      weight:
        type: number
      weight_name:
        type: string
    type: object
  model.TripStep:
    properties:
      distance:
        type: number
      duration:
        type: number
      geometry:
        type: string
      instruction:
        type: string
      maneuver:
        type: string
      name:
        type: string
      summary:
        type: string
      weight:
        type: number
    type: object
  model.TripStop:
    properties:
      distance:
        type: number
      input_index:
        type: integer
      location:
        $ref: '#/definitions/model.LatLng'
      place_id:
        type: string
      trips_index:
        type: integer
      waypoint_index:
        type: integer
    type: object
  response.AddressComponent:
    properties:
      long_name:
        type: string
      short_name:
        type: string
    type: object
  response.AdministrativeCompound:
    properties:
      commune:
        type: string
      district:
        type: string
      province:
        type: string
    type: object
  response.AdministrativeCompoundID:
    properties:
      commune:
        type: integer
      district:
        type: integer
      province:
        type: integer
    type: object
  response.AutocompleteResponse:
    properties:
      predictions:
        items:
          $ref: '#/definitions/response.PlacePrediction'
        type: array
      status:
        type: string
    type: object
  response.GeocodeGeometry:
    properties:
      boundary:
        type: string
      location:
        $ref: '#/definitions/response.LatLng'
    type: object
  response.GeocodeResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/response.GeocodeResult'
        type: array
      status:
        type: string
    type: object
  response.GeocodeResult:
    properties:
      address:
        type: string
      address_components:
        items:
          $ref: '#/definitions/response.AddressComponent'
        type: array
      compound:
        $ref: '#/definitions/response.AdministrativeCompound'
      deprecated_compound:
        $ref: '#/definitions/response.AdministrativeCompound'
      deprecated_compound_id:
        $ref: '#/definitions/response.AdministrativeCompoundID'
      deprecated_description:
        type: string
      formatted_address:
        type: string
      geometry:
        $ref: '#/definitions/response.GeocodeGeometry'
      name:
        type: string
      place_id:
        type: string
      plus_code:
        $ref: '#/definitions/response.PlusCode'
      reference:
        type: string
      types:
        items:
          type: string
        type: array
    type: object
  response.LatLng:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  response.PlaceDetail:
    properties:
      compound:
        $ref: '#/definitions/response.AdministrativeCompound'
      deprecated_compound:
        $ref: '#/definitions/response.AdministrativeCompound'
      deprecated_description:
        type: string
      formatted_address:
        type: string
      geometry:
        $ref: '#/definitions/response.PlaceGeometry'
      name:
        type: string
      place_id:
        type: string
    type: object
  response.PlaceDetailResponse:
    properties:
      result:
        $ref: '#/definitions/response.PlaceDetail'
      status:
        type: string
    type: object
  response.PlaceGeometry:
    properties:
      location:
        $ref: '#/definitions/response.LatLng'
    type: object
  response.PlacePrediction:
    properties:
      compound:
        $ref: '#/definitions/response.AdministrativeCompound'
      deprecated_compound:
        $ref: '#/definitions/response.AdministrativeCompound'
      deprecated_description:
        type: string
      description:
        type: string
      place_id:
        type: string
      structured_formatting:
        $ref: '#/definitions/response.StructuredFormatting'
    type: object
  response.PlusCode:
    properties:
      compound_code:
        type: string
      global_code:
        type: string
    type: object
  response.StructuredFormatting:
    properties:
      main_text:
        type: string
      secondary_text:
        type: string
    type: object
  share.ErrorResponse:
    properties:
      error:
        example: invalid input
        type: string
    type: object
info:
  contact: {}
  description: API Server for Road2D
  title: Road2D
  version: "1.0"
paths:
  /goong/directions:
    get:
      description: Goong Directions v2. Default vehicle is bike (two-wheeler / motorbike
        lanes). motorcycle and motorbike are aliased to bike.
      parameters:
      - description: Origin lat,lng
        in: query
        name: origin
        required: true
        type: string
      - description: Destination lat,lng (semicolon-separated for extra stops)
        in: query
        name: destination
        required: true
        type: string
      - description: car, bike, taxi, truck, hd. motorbike/motorcycle → bike
        in: query
        name: vehicle
        type: string
      - description: Return alternatives; skips LocationLeg cache
        in: query
        name: alternatives
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LocationLeg'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - PlaygroundKey: []
      summary: Route A to B
      tags:
      - goong
  /goong/geocode:
    get:
      description: Goong Geocode v2. Provide exactly one of address (forward), latlng
        (reverse), or place_id. Default results use the new administrative units.
        has_deprecated_administrative_unit=true adds pre-merger names. has_vnid=true
        adds deprecated_compound_id on reverse.
      parameters:
      - description: 'Forward: address to coordinates'
        in: query
        name: address
        type: string
      - description: 'Reverse: lat,lng to address'
        in: query
        name: latlng
        type: string
      - description: Lookup by Goong place_id
        in: query
        name: place_id
        type: string
      - description: Max results (reverse)
        in: query
        name: limit
        type: integer
      - description: true = also return deprecated_description / deprecated_compound
        in: query
        name: has_deprecated_administrative_unit
        type: boolean
      - description: true = also return deprecated_compound_id (VN admin codes)
        in: query
        name: has_vnid
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.GeocodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - PlaygroundKey: []
      summary: Geocode address or coordinates
      tags:
      - goong
  /goong/places/autocomplete:
    get:
      description: Goong Place Autocomplete v2. Default returns new administrative
        units. Set has_deprecated_administrative_unit=true to also get pre-merger
        names.
      parameters:
      - description: Search keyword
        in: query
        name: input
        required: true
        type: string
      - description: Bias as lat,lng
        in: query
        name: location
        type: string
      - description: Max predictions
        in: query
        name: limit
        type: integer
      - description: true = also return deprecated_description / deprecated_compound
        in: query
        name: has_deprecated_administrative_unit
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AutocompleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - PlaygroundKey: []
      summary: Autocomplete places
      tags:
      - goong
  /goong/places/detail:
    get:
      description: Goong Place Detail v2 by place_id. Default address is the new administrative
        unit.
      parameters:
      - description: Goong place_id
        in: query
        name: place_id
        required: true
        type: string
      - description: true = also return deprecated_description / deprecated_compound
        in: query
        name: has_deprecated_administrative_unit
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PlaceDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - PlaygroundKey: []
      summary: Place detail
      tags:
      - goong
  /goong/trips:
    get:
      description: Goong Trip v2 is a single-vehicle TSP, not a branch graph. waypoints
        is a bag of lat,lng points (semicolon-separated), not an edge list. The waypoints
        array stays in input order; waypoint_index / visit_order is the visit sequence
        on that one tour. trips_index is copied from OSRM and is 0 unless Goong returns
        several tours — it does not mean a split at a shared vertex.
      parameters:
      - description: Start lat,lng. If omitted Goong picks a stop.
        in: query
        name: origin
        type: string
      - description: End lat,lng. If omitted Goong picks a stop.
        in: query
        name: destination
        type: string
      - description: Stops between origin and destination, lat,lng separated by ;
        in: query
        name: waypoints
        type: string
      - description: car, bike, taxi, truck, hd. Default car. motorbike/motorcycle
          → bike
        in: query
        name: vehicle
        type: string
      - description: Return to start. Default true
        in: query
        name: roundtrip
        type: boolean
      - description: Turn-by-turn per leg. Default true (Goong/OSRM default is false,
          which yields empty steps)
        in: query
        name: steps
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Trip'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/share.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/share.ErrorResponse'
      security:
      - PlaygroundKey: []
      summary: Optimize multi-stop trip
      tags:
      - goong
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
  PlaygroundKey:
    description: Shared secret from GOONG_PLAYGROUND_KEY. Scalar → Authorize.
    in: header
    name: X-Playground-Key
    type: apiKey
swagger: "2.0"
